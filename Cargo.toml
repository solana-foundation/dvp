[workspace]

members = [
    "program",
    "clients/rust",
    "tests/integration-tests",
    "tests/transfer-hook-fixture",
    "tests/smart-wallet-fixture",
    "tests/confidential-transfer-fixture",
]

resolver = "2"

package.version = "0.1.0"
package.edition = "2021"

[workspace.dependencies]
borsh = "1.5.5"
codama = "^0.7.2"
num-derive = "0.4.1"
num-traits = "0.2.19"
pinocchio = "^0.10.1"
pinocchio-associated-token-account = "^0.3.0"
pinocchio-log = "^0.5.1"
pinocchio-system = "^0.5.0"
pinocchio-token = "0.5.0"
pinocchio-token-2022 = "^0.2.0"
solana-security-txt = "1.1.3"
serde_json = "1.0.145"
# ExtensionType is the effective mint-extension allowlist: unknown types are
# rejected. Review new variants against validate_mint_extensions before a bump.
spl-token-2022-interface = "=3.1.1"
thiserror = "2.0.17"
dvp-swap-program-client = { path = "clients/rust", features = ["fetch"] }
