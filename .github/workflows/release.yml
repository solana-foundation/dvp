# Onchain program release workflow (SDLC Section 3.5.1).
#
# Steady-state upgrade flow. A net-new program's FIRST deploy is done manually
# by the deployer keypair (see docs/program-upgrade-mechanism.md); this workflow
# handles every subsequent devnet/mainnet upgrade.
#
#   devnet:  deployer holds upgrade authority and upgrades the program directly.
#   mainnet: CI only writes buffers and hands their authority to the Squads
#            vault. A human then creates the Squads upgrade proposal from the
#            buffers listed in the run summary. The CI keypair is fee payer and
#            buffer writer only; it is never a Squads member.
name: Release

on:
  workflow_dispatch:
    inputs:
      network:
        description: Target network
        type: choice
        options: [devnet, mainnet]
        required: true
      priority-fee:
        description: Priority fee (microlamports per CU)
        type: string
        default: '100000'

permissions:
  id-token: write
  contents: read

concurrency:
  group: release-${{ inputs.network }}
  cancel-in-progress: false

env:
  PROGRAM: dvp_swap_program
  PROGRAM_ID: dvp34bdbcEm4f4FCUjGV4mDAkDshaQR4LkK8fdcsyZq
  REPO_URL: https://github.com/solana-foundation/dvp

jobs:
  guard-allowed-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Guard allowed source branch
        run: |
          case "${{ github.ref }}" in
            refs/heads/main) ;;
            *)
              echo "::error::Release must run from main. Current ref: ${{ github.ref }}"
              exit 1
              ;;
          esac

  release:
    name: Release ${{ inputs.network }}
    needs: guard-allowed-branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          rust-cache-key: 'release-${{ inputs.network }}'
          solana-version: 'v4.0.0'

      - name: Install solana-verify
        run: cargo install solana-verify --locked

      # Fetch secrets only after all toolchain setup (third-party actions and the
      # remote Solana installer) has run, so deploy credentials are never present
      # in the environment while untrusted setup code executes.
      - name: Load deploy config from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: dvp
          doppler-config: ${{ inputs.network == 'mainnet' && 'prd_github' || 'stg_github' }}
          inject-env-vars: true

      - name: Materialize deployer keypair
        run: |
          install -m 600 /dev/null /tmp/deployer.json
          printf '%s' "$DEPLOYER_KEYPAIR" > /tmp/deployer.json

      - name: Derive deployer pubkey
        id: deployer
        run: |
          PUBKEY=$(solana-keygen pubkey /tmp/deployer.json)
          echo "pubkey=$PUBKEY" >> "$GITHUB_OUTPUT"

      - name: Configure Solana CLI
        run: solana config set --url "$RPC_URL" --keypair "$HOME/.config/solana/id.json" > /dev/null

      - name: Generate IDL
        run: make generate-idl

      - name: Build verified program
        uses: solana-foundation/github-actions/build-verified@4dcdecb13d956467088835b1c644b38e0ee1d5d9
        with:
          program: ${{ env.PROGRAM }}

      - id: write-buffer
        if: inputs.network == 'devnet'
        name: Write program buffer
        uses: solana-foundation/github-actions/write-program-buffer@4dcdecb13d956467088835b1c644b38e0ee1d5d9
        with:
          program: ${{ env.PROGRAM }}
          program-id: ${{ env.PROGRAM_ID }}
          rpc-url: ${{ env.RPC_URL }}
          keypair: ${{ env.DEPLOYER_KEYPAIR }}
          buffer-authority-address: ${{ steps.deployer.outputs.pubkey }}
          priority-fee: ${{ inputs.priority-fee }}

      # ============================================
      # devnet: direct upgrade by deployer
      # ============================================
      - if: inputs.network == 'devnet'
        name: Upgrade program (devnet)
        uses: solana-foundation/github-actions/program-upgrade@4dcdecb13d956467088835b1c644b38e0ee1d5d9
        with:
          program: ${{ env.PROGRAM }}
          program-id: ${{ env.PROGRAM_ID }}
          buffer: ${{ steps.write-buffer.outputs.buffer }}
          rpc-url: ${{ env.RPC_URL }}
          keypair: ${{ env.DEPLOYER_KEYPAIR }}

      - if: inputs.network == 'devnet'
        name: Upload IDL via program-metadata (devnet)
        uses: solana-foundation/github-actions/metadata-upload@4dcdecb13d956467088835b1c644b38e0ee1d5d9
        with:
          program-id: ${{ env.PROGRAM_ID }}
          rpc-url: ${{ env.RPC_URL }}
          keypair: ${{ env.DEPLOYER_KEYPAIR }}
          idl-path: idl/dvp_swap_program.json
          priority-fees: ${{ inputs.priority-fee }}

      # ============================================
      # mainnet: prepare Squads-owned buffers
      # ============================================
      - if: inputs.network == 'mainnet'
        id: prepare-squads-release
        name: Prepare Squads release buffers (mainnet)
        uses: solana-foundation/github-actions/prepare-squads-release@4dcdecb13d956467088835b1c644b38e0ee1d5d9
        with:
          program: ${{ env.PROGRAM }}
          program-id: ${{ env.PROGRAM_ID }}
          rpc-url: ${{ env.RPC_URL }}
          keypair: ${{ env.DEPLOYER_KEYPAIR }}
          squads-vault: ${{ env.SQUADS_VAULT }}
          metadata-path: idl/dvp_swap_program.json
          priority-fee: ${{ inputs.priority-fee }}

      - if: inputs.network == 'mainnet'
        id: export-verify-tx
        name: Export verify PDA transaction (mainnet)
        uses: solana-foundation/github-actions/verify-build@4dcdecb13d956467088835b1c644b38e0ee1d5d9
        with:
          program: ${{ env.PROGRAM }}
          program-id: ${{ env.PROGRAM_ID }}
          rpc-url: ${{ env.RPC_URL }}
          keypair: ${{ env.DEPLOYER_KEYPAIR }}
          repo-url: ${{ env.REPO_URL }}
          commit-hash: ${{ github.sha }}
          network: mainnet
          use-squads: 'true'
          vault-address: ${{ env.SQUADS_VAULT }}

      - if: inputs.network == 'mainnet'
        id: export-metadata-tx
        name: Export metadata write transaction (mainnet)
        uses: solana-foundation/github-actions/metadata-upload@4dcdecb13d956467088835b1c644b38e0ee1d5d9
        with:
          program-id: ${{ env.PROGRAM_ID }}
          rpc-url: ${{ env.RPC_URL }}
          keypair: ${{ env.DEPLOYER_KEYPAIR }}
          buffer: ${{ steps.prepare-squads-release.outputs.metadata-buffer }}
          export: ${{ env.SQUADS_VAULT }}
          priority-fees: ${{ inputs.priority-fee }}

      - if: inputs.network == 'mainnet'
        name: Confirm mainnet buffer handoff
        run: |
          : "${SQUADS_VAULT:?Set SQUADS_VAULT in Doppler prd_github}"
          echo "Program buffer authority assigned to Squads vault: $SQUADS_VAULT"
          echo "IDL metadata buffer authority assigned to Squads vault: $SQUADS_VAULT"

      - name: Cleanup keypair
        if: always()
        run: rm -f /tmp/deployer.json

      - name: Summary
        run: |
          echo "## Release: ${{ inputs.network }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Program: \`${{ env.PROGRAM_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.network }}" = "mainnet" ]; then
            echo "- Buffer: \`${{ steps['prepare-squads-release'].outputs.buffer }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- IDL buffer: \`${{ steps['prepare-squads-release'].outputs['metadata-buffer'] }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Buffer authority: \`${{ env.SQUADS_VAULT }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Verify PDA transaction (base58, import into Squads):" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps['export-verify-tx'].outputs.pda_tx }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "- Metadata write transactions (base58, one per line, import into Squads):" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps['export-metadata-tx'].outputs.tx }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "- **Action required**: create the Squads upgrade proposal using the listed buffers and imported transactions" >> $GITHUB_STEP_SUMMARY
            echo "- CI keypair role: fee payer and buffer writer only; it does not need Squads membership" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Buffer: \`${{ steps.write-buffer.outputs.buffer }}\`" >> $GITHUB_STEP_SUMMARY
          fi
