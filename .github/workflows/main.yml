# Workspace tests and generated client consistency.
name: Main

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_CLI_VERSION: 4.2.2
  CARGO_BUILD_SBF_VERSION: 4.1.0
  # SHA-256 of solana-release-x86_64-unknown-linux-gnu.tar.bz2 for SOLANA_CLI_VERSION.
  AGAVE_RELEASE_SHA256: 5fc8684f7430038105fde953d4308ed56addf627f658daa61709f345448247ee

jobs:
  rust:
    name: Rust
    needs: generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain components
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-clients
          path: clients

      - name: Install Solana CLI and cargo-build-sbf
        run: |
          archive="$RUNNER_TEMP/solana-release.tar.bz2"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_CLI_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o "$archive"
          echo "${AGAVE_RELEASE_SHA256}  $archive" | sha256sum --check --strict
          tar -xjf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Verify cargo-build-sbf version
        run: test "$(cargo-build-sbf --version | head -n 1)" = "cargo-build-sbf ${CARGO_BUILD_SBF_VERSION}"

      - name: Format
        run: cargo fmt --all -- --check
      - name: Build program
        run: make build-sbf build-hook-fixture build-smart-wallet-fixture build-confidential-fixture

      - name: Cache pinned test programs
        id: test-programs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            tests/fixtures/spl_token_2022.so
            tests/fixtures/spl_record.so
          key: test-programs-${{ hashFiles('tests/fixtures/SHA256SUMS') }}
      - name: Fetch pinned test programs
        if: steps.test-programs.outputs.cache-hit != 'true'
        run: make fetch-test-fixtures
      - name: Verify pinned test programs
        run: make check-test-fixtures
      # Integration tests embed these binaries at compile time.
      - name: Rust client feature combinations
        run: |
          cargo check -p dvp-swap-program-client --locked --no-default-features
          cargo check -p dvp-swap-program-client --locked --no-default-features --features fetch
          cargo check -p dvp-swap-program-client --locked --no-default-features --features confidential
          cargo check -p dvp-swap-program-client --locked --no-default-features --features confidential,fetch --example confidential
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        env:
          RUST_LOG: error
        run: cargo test --locked --workspace --all-features
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: TypeScript client tests
        run: make typescript-test

  generation:
    name: Generated clients
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain components
        run: rustup component add rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate IDL and clients
        run: make generate-clients
      - name: Check generated files
        run: |
          generated_changes=$(git status --porcelain --untracked-files=all -- idl/dvp_swap_program.json clients/rust clients/typescript)
          printf '%s\n' "$generated_changes"
          test -z "$generated_changes"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-clients
          path: |
            clients/rust/src/generated
            clients/typescript/src/generated
          if-no-files-found: error

  js:
    name: JS
    needs: generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-clients
          path: clients
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:unit
