[package]
name = "dvp-swap-program-client"
version = "0.0.1"
edition = "2021"
autotests = false
description = "Rust client for the DvP Swap Program"
license = "MIT"
repository = "https://github.com/solana-foundation/dvp"

[dependencies]
borsh = { workspace = true, features = ["derive"] }
solana-account-info = "3.1.1"
# PDA derivation and generated Borsh readers; Solana uses PDA syscalls on SBF.
solana-pubkey = { version = "4.2.1", features = ["curve25519", "borsh"] }
solana-instruction = "3.4.1"
solana-cpi = "3.1"
num-derive = { workspace = true }

solana-account-decoder-client-types = { version = "4.2.2", optional = true }
solana-transaction-status-client-types = { version = "4.2.2", optional = true }
bs58 = { version = "0.5", optional = true }
solana-client = { version = "4.2.2", optional = true }
solana-account = { version = "4.3", optional = true }
num-traits = { workspace = true }

solana-program-error = "3.0"
thiserror = { workspace = true }

# Host-side confidential keys, proofs and transaction preparation.
bytemuck = { version = "1", optional = true }
curve25519-dalek = { version = "4.1", optional = true }
hkdf = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
solana-compute-budget-interface = { version = "3.0", optional = true }
spl-record = { version = "0.4", features = ["no-entrypoint"], optional = true }
solana-hash = { version = "4.2", optional = true }
solana-keypair = { version = "3", optional = true }
solana-message = { version = "4.4", features = ["wincode"], optional = true }
solana-packet = { version = "4.2", optional = true }
solana-rent = { version = "4.3", optional = true }
solana-signature = { version = "3.3", optional = true }
solana-signer = { version = "3", optional = true }
solana-system-interface = { version = "3.2", features = ["bincode"], optional = true }
solana-transaction = { version = "4.1", features = ["wincode", "serde"], optional = true }
solana-zk-sdk = { version = "7.0.1", optional = true }
solana-zk-sdk-pod = { version = "0.1.2", optional = true }
solana-zk-elgamal-proof-interface = { version = "0.1.3", optional = true }
spl-token-2022-interface = { version = "3.1.1", optional = true }
spl-token-confidential-transfer-proof-generation = { version = "0.6.1", optional = true }
spl-token-confidential-transfer-proof-extraction = { version = "0.6.1", optional = true }
spl-transfer-hook-interface = { version = "2.1", optional = true }
wincode = { version = "0.5", optional = true }

[[example]]
name = "confidential"
path = "examples/confidential/mod.rs"
crate-type = ["lib"]
required-features = ["confidential", "fetch"]

[[test]]
name = "integration"
path = "tests/main.rs"
required-features = ["fetch", "test-utils"]

[dev-dependencies]
solana-loader-v3-interface = { version = "8.0", features = ["wincode"] }
litesvm = "=0.16.0"
base64 = "0.22"
futures = "0.3"
solana-address-lookup-table-interface = { version = "3.1", features = ["bincode"] }
solana-clock = "3.1"
solana-nullable = { version = "1.3", features = ["bytemuck"] }
solana-program-option = "3.1"
solana-program-pack = "3.1"
solana-sdk-ids = "3.1"
spl-associated-token-account-interface = "2"
spl-token-interface = "3"
spl-tlv-account-resolution = "0.11.4"
hmac = "0.12"
serde_json = { workspace = true }

[features]
default = []
confidential = [
    "dep:bytemuck",
    "dep:curve25519-dalek",
    "dep:hkdf",
    "dep:sha2",
    "dep:solana-compute-budget-interface",
    "dep:spl-record",
    "dep:solana-hash",
    "dep:solana-keypair",
    "dep:solana-message",
    "dep:solana-packet",
    "dep:solana-rent",
    "dep:solana-signature",
    "dep:solana-signer",
    "dep:solana-system-interface",
    "dep:solana-transaction",
    "dep:solana-zk-sdk",
    "dep:solana-zk-sdk-pod",
    "dep:solana-zk-elgamal-proof-interface",
    "dep:spl-token-2022-interface",
    "dep:spl-token-confidential-transfer-proof-generation",
    "dep:spl-token-confidential-transfer-proof-extraction",
    "dep:spl-transfer-hook-interface",
    "dep:wincode",
]
# Internal test support, excluded from the normal integrator API.
test-utils = ["confidential"]
fetch = ["solana-client", "solana-account", "solana-account-decoder-client-types", "solana-transaction-status-client-types", "bs58"]

[package.metadata.cargo-machete]
ignored = ["num-traits"]
